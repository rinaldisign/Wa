<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interaktif - Three.js</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
    body{background:#0f0f1a;color:white;min-height:100vh}
    .container{max-width:900px;margin:0 auto;padding:20px;text-align:center}
    header h1{font-size:32px;background:linear-gradient(90deg,#ff6b81,#1e90ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    header p{color:#aaa;margin:8px 0 20px;font-size:14px}
    #canvas-container{width:100%;height:480px;background:#1a1a2e;border-radius:16px;overflow:hidden;border:1px solid #333;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
    #canvas-container canvas{display:block}
    .controls{margin-top:20px;background:#1a1a2e;padding:20px;border-radius:16px;display:flex;flex-direction:column;gap:15px}
    .group{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
    .group label{font-weight:bold;min-width:80px;text-align:right;color:#ccc}
    button{background:#2f3542;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;transition:0.2s}
    button:hover{background:#1e90ff;transform:translateY(-2px)}
    .color-btn{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid white}
    @media(max-width:600px){#canvas-container{height:320px}.group label{width:100%;text-align:center}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div class="container">
    <header><h1>3D Playground</h1><p>Drag untuk putar • Scroll untuk zoom • Klik tombol untuk ganti</p></header>
    <div id="canvas-container"></div>
    <div class="controls">
      <div class="group"><label>Bentuk:</label>
        <button onclick="gantiBentuk('box')">Kubus</button>
        <button onclick="gantiBentuk('sphere')">Bola</button>
        <button onclick="gantiBentuk('torus')">Donat</button>
        <button onclick="gantiBentuk('cone')">Kerucut</button>
      </div>
      <div class="group"><label>Warna:</label>
        <button class="color-btn" style="background:#ff4757" onclick="gantiWarna(0xff4757)"></button>
        <button class="color-btn" style="background:#2ed573" onclick="gantiWarna(0x2ed573)"></button>
        <button class="color-btn" style="background:#1e90ff" onclick="gantiWarna(0x1e90ff)"></button>
        <button class="color-btn" style="background:#eccc68" onclick="gantiWarna(0xeccc68)"></button>
        <button class="color-btn" style="background:#a55eea" onclick="gantiWarna(0xa55eea)"></button>
      </div>
      <div class="group"><label>Animasi:</label>
        <button id="btn-putar" onclick="togglePutar()">Pause Putar</button>
        <button onclick="toggleWireframe()">Wireframe</button>
        <button onclick="acakPosisi()">Acak Posisi</button>
      </div>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(5, 5, 5); scene.add(dir);
    const point = new THREE.PointLight(0xff6b81, 20, 20);
    point.position.set(-3, 2, 3); scene.add(point);
    let material = new THREE.MeshStandardMaterial({ color: 0x1e90ff, roughness: 0.3, metalness: 0.4 });
    let mesh = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), material);
    scene.add(mesh);
    let autoPutar = true, isWireframe = false;
    window.gantiBentuk = function(tipe){
      scene.remove(mesh); let g;
      if(tipe==='box') g = new THREE.BoxGeometry(1.8,1.8,1.8);
      if(tipe==='sphere') g = new THREE.SphereGeometry(1.3,32,32);
      if(tipe==='torus') g = new THREE.TorusGeometry(1.1,0.45,16,100);
      if(tipe==='cone') g = new THREE.ConeGeometry(1.2,2.2,32);
      mesh = new THREE.Mesh(g, material); scene.add(mesh);
    };
    window.gantiWarna = (hex)=> material.color.setHex(hex);
    window.togglePutar = function(){ autoPutar=!autoPutar; document.getElementById('btn-putar').innerText = autoPutar?'Pause Putar':'Putar Lagi'; };
    window.toggleWireframe = function(){ isWireframe=!isWireframe; material.wireframe=isWireframe; };
    window.acakPosisi = function(){ mesh.position.x=(Math.random()-0.5)*2; mesh.position.y=(Math.random()-0.5)*2; mesh.rotation.set(Math.random()*3,Math.random()*3,0); };
    window.addEventListener('resize', ()=>{ camera.aspect=container.clientWidth/container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });
    function animate(){ requestAnimationFrame(animate); if(autoPutar){ mesh.rotation.x+=0.01; mesh.rotation.y+=0.01; } controls.update(); renderer.render(scene,camera); }
    animate();
    renderer.domElement.addEventListener('click', ()=>{ mesh.scale.set(1.3,1.3,1.3); setTimeout(()=>mesh.scale.set(1,1,1),200); });
  </script>
</body>
</html>
